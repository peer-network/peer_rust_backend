[package]
name = "peer-reward-program"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
# Solana Program Dependencies (matching workspace versions)
solana-program = "2.1"
spl-token-2022 = "5.0"

# Borsh for serialization
borsh = "1.5"

# Utilities
thiserror = "1.0"

[dev-dependencies]
solana-program-test = "2.1"
solana-sdk = "2.1"
tokio = { version = "1.40", features = ["full"] }

[features]
no-entrypoint = []
