[workspace]
members = [
    "crates/peer-token-cli",
    "crates/peer-server",
    "crates/peer-common",
    # "crates/peer-reward-program",  # Excluded: build separately to avoid version conflicts
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Peer Network"]
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
config = "0.14"
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
solana-sdk = "2.3.1"
solana-client = "2.3.7"
spl-associated-token-account = "7.0.0"
spl-token-2022 = "9.0.0"



