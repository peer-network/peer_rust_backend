title = "Peer Rust Backend Gitleaks Config"

[[rules]]
id = "rust-backend-catch-common-secrets"
description = "Catch common secrets in Rust backend (API keys, JWTs, database passwords, tokens, private keys)"
regex = '''(?i)(ghp_[0-9A-Za-z]{36}|github_pat_[0-9A-Za-z_]{20,}|glpat-[0-9A-Za-z\-_]{20}|AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9._-]+\.[A-Za-z0-9._-]+|-----BEGIN( RSA| DSA| EC| OPENSSH)? PRIVATE KEY-----|token\s*=\s*["'][A-Za-z0-9_\-]{10,}["']|password\s*=\s*["'][^"']{6,}["']|api[_-]?key\s*[:=]\s*["'][A-Za-z0-9_\-]{10,}["'])'''
tags = ["rust", "backend", "api", "key", "secret"]

[[rules]]
id = "jwt-and-oauth-tokens"
description = "Detect JWTs, OAuth tokens, or long Base64-like secrets"
regex = '''eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9._-]+\.[A-Za-z0-9._-]+'''
tags = ["jwt", "token", "auth"]

[[rules]]
id = "database-and-service-creds"
description = "Detect Postgres, Redis, or service connection strings"
regex = '''(?i)(postgres(?:ql)?:\/\/[A-Za-z0-9:_@.\-\/]+|redis:\/\/[A-Za-z0-9:_@.\-\/]+|mongodb:\/\/[A-Za-z0-9:_@.\-\/]+)'''
tags = ["database", "rust", "service"]

[[rules]]
id = "aws-and-cloud-creds"
description = "Detect AWS, GCP, or generic cloud provider credentials"
regex = '''(?i)(AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|GOOG1E[A-Za-z0-9_-]{30,}|gcp_project_id\s*[:=]\s*["'][A-Za-z0-9_\-]{5,}["'])'''
tags = ["cloud", "aws", "gcp"]

[[rules]]
id = "rust-env-files"
description = "Detect sensitive environment variable values in .env or config.rs"
regex = '''(?i)(DATABASE_URL\s*=\s*["'][^"']+["']|JWT_SECRET\s*=\s*["'][^"']+["']|API_KEY\s*=\s*["'][A-Za-z0-9_\-]{10,}["']|SECRET_KEY\s*=\s*["'][A-Za-z0-9_\-]{10,}["'])'''
tags = ["rust", "dotenv", "config", "key"]

[rules.allowlist]
description = "Allow safe constants and test patterns"
regexes = [
  '''(?i)test_(user|token|api|key|password)''',
  '''(?i)example\.com''',
  '''(?i)localhost''',
  '''(?i)127\.0\.0\.1''',
  '''(?i)env::var''',
  '''(?i)std::env''',
  '''(?i)println!''',
  '''(?i)mock(|_data|_value)''',
  '''(?i)sample(|_key|_token)''',
  '''(?i)fake(|_jwt|_uuid|_token)'''
]

[pathDenylist]
description = "Exclude irrelevant or generated files"
regexes = [
  '''^target/.*''',
  '''^dist/.*''',
  '''^build/.*''',
  '''^logs?/.*''',
  '''^tmp/.*''',
  '''^\.env.*$''',
  '''^\.github/workflows/.*''',
  '''^\.git/.*''',
  '''^node_modules/.*''',
  '''^tests?/.*'''
]
